<title>プロデュースウォーズ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="プロデュースウォーズ">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one column, header strip → square-tile map → context panel; stage-lighting tints per attribute */
:root{
  --bg:#f5f2f8; --surface:#ffffff; --ink:#221d2b; --muted:#6c6478; --line:#ddd5e5;
  --p0:#6a3fd2; --p0-soft:#f0ecfa; --p1:#2563eb; --p1-soft:#e9effd; --p2:#2f8f3a; --p2-soft:#eaf4eb; --p3:#e07a1a; --p3-soft:#fcf2e8; --p4:#d62b2b; --p4-soft:#fbeaea;
  --vo:#d92b3d; --da:#2a6fd1; --vi:#d98a00;
  --t-plain:#f4f1f7; --t-bldg:#cfc8d8; --t-park:#e3f0de; --t-stage:#f9e8ea; --t-street:#e7eef9; --t-photo:#faf1dc; --t-prop:#ece8f1; --t-fans:#f6cfe0; --t-fans2:#fdf2f7;--t-sea:#cfe4f2;--t-shallow:#e6f1dc;
  --hl-move:#3b82f6; --hl-atk:#e5484d; --glyph:rgba(34,29,43,.32); --on-unit:#ffffff;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15121b; --surface:#211c29; --ink:#eee9f5; --muted:#a39ab1; --line:#3a3346;
  --p0:#9874f2; --p0-soft:#272033; --p1:#6ea2ff; --p1-soft:#252334; --p2:#5cbf62; --p2-soft:#24242c; --p3:#f08a3c; --p3-soft:#2b222a; --p4:#ff6b6b; --p4-soft:#2c202c;
  --vo:#f2596a; --da:#5c97f0; --vi:#f2b23a;
  --t-plain:#2a2533; --t-bldg:#3f384b; --t-park:#29352d; --t-stage:#3b2a2f; --t-street:#27344a; --t-photo:#3a3425; --t-prop:#312c3a; --t-fans:#613050; --t-fans2:#43283a;--t-sea:#1f3446;--t-shallow:#2f3d32;
  --hl-move:#60a5fa; --hl-atk:#ff6b70; --glyph:rgba(238,233,245,.3); --on-unit:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15121b; --surface:#211c29; --ink:#eee9f5; --muted:#a39ab1; --line:#3a3346;
  --p0:#9874f2; --p0-soft:#272033; --p1:#6ea2ff; --p1-soft:#252334; --p2:#5cbf62; --p2-soft:#24242c; --p3:#f08a3c; --p3-soft:#2b222a; --p4:#ff6b6b; --p4-soft:#2c202c;
  --vo:#f2596a; --da:#5c97f0; --vi:#f2b23a;
  --t-plain:#2a2533; --t-bldg:#3f384b; --t-park:#29352d; --t-stage:#3b2a2f; --t-street:#27344a; --t-photo:#3a3425; --t-prop:#312c3a; --t-fans:#613050; --t-fans2:#43283a;--t-sea:#1f3446;--t-shallow:#2f3d32;
  --hl-move:#60a5fa; --hl-atk:#ff6b70; --glyph:rgba(238,233,245,.3); --on-unit:#ffffff; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:14px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label:focus-within{outline:2px solid var(--hl-move);outline-offset:2px}
h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.tag{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hdr{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;color:var(--on-unit);font-weight:700;font-size:13px;white-space:nowrap}
.chip.s0{background:var(--p0)}.chip.s1{background:var(--p1)}.chip.s2{background:var(--p2)}.chip.s3{background:var(--p3)}.chip.s4{background:var(--p4)}
.day{font-family:var(--display);font-size:16px}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.gauge{display:flex;gap:2px}
.gauge i{width:12px;height:8px;border-radius:2px;background:var(--line)}
.gauge i.on{background:var(--vi)}
.gauge i.need{box-shadow:inset 0 -2px 0 var(--ink)}
.bw{overflow:auto;max-height:72vh;border-radius:8px;-webkit-overflow-scrolling:touch}
.zoom{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.zb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px}
.zb[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.board{display:grid;gap:2px;background:var(--line);padding:2px;border-radius:8px;touch-action:manipulation;user-select:none}
.cell{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:3px;background:var(--t-plain);display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center}
.cell .g{font-size:clamp(9px,2.8vw,14px);color:var(--glyph);font-weight:700}
.cell.hasimg .g{display:none}
.t-fans{background:repeating-linear-gradient(45deg,var(--t-fans) 0 4px,var(--t-fans2) 4px 8px)}
.t-fans .g{color:var(--ink);font-weight:700;text-shadow:0 0 3px var(--t-fans2)}
.t-bldg{background-color:var(--t-bldg)}.t-park{background-color:var(--t-park)}.t-stage{background-color:var(--t-stage)}.t-street{background-color:var(--t-street)}.t-photo{background-color:var(--t-photo)}
.prop{background-color:var(--t-prop)}.prop.o0{--pc:var(--p0);background-color:var(--p0-soft)}.prop.o1{--pc:var(--p1);background-color:var(--p1-soft)}.prop.o2{--pc:var(--p2);background-color:var(--p2-soft)}.prop.o3{--pc:var(--p3);background-color:var(--p3-soft)}.prop.o4{--pc:var(--p4);background-color:var(--p4-soft)}
.prop .g{color:var(--ink);opacity:.55}
.g.sq{display:block;width:52%;height:52%;border:2.5px solid currentColor;border-radius:3px;box-sizing:border-box;background:transparent}
.g.tv{position:relative;display:block;width:62%;height:42%;margin-top:18%;border:2.5px solid currentColor;border-radius:4px;box-sizing:border-box}
.g.tv::before,.g.tv::after{content:"";position:absolute;bottom:100%;width:2.5px;height:62%;background:currentColor;transform-origin:bottom center}
.g.tv::before{left:38%;transform:rotate(-32deg)}.g.tv::after{right:38%;transform:rotate(32deg)}
.g.tw{font-weight:700;font-size:clamp(9px,2.8vw,14px)}
.g.tower{display:block;width:72%;height:92%}
.g.plane{display:block;width:72%;height:72%}
.mapcnt{display:block;font-size:10px;line-height:1.5;opacity:.85;margin-top:2px;font-weight:400}.g.plane svg{display:block;width:100%;height:100%}
.g.tower svg{display:block;width:100%;height:100%}
.g.star{font-size:clamp(14px,4.4vw,22px);line-height:1}
.g.tri{position:relative;display:block;width:88%;height:80%;line-height:1}
.g.tri::before{content:"";position:absolute;inset:0;background:currentColor;clip-path:polygon(50% 0,100% 100%,0 100%)}
.g.tri::after{content:"";position:absolute;inset:0;background:var(--surface);clip-path:polygon(50% 17%,86% 91%,14% 91%)}
.g.tri b{position:absolute;left:0;right:0;bottom:4%;z-index:1;font-size:clamp(7px,2.1vw,13px);text-align:center;color:var(--ink);line-height:1}
.prop.o0 .g,.prop.o1 .g,.prop.o2 .g,.prop.o3 .g,.prop.o4 .g{color:var(--pc);opacity:1}
.mapprev i::after{display:none!important}
.prop.o0::after,.prop.o1::after,.prop.o2::after,.prop.o3::after,.prop.o4::after{content:"";position:absolute;inset:0;border:1px solid color-mix(in srgb,var(--pc) 18%,transparent);border-radius:3px;pointer-events:none;display:none}
.prop.hasimg::after{border-width:1px}
.cell.threat{box-shadow:inset 0 0 0 100px rgba(229,72,77,.24)}
.cell.threat.sel{box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 100px rgba(229,72,77,.24)}
.cell.merge{box-shadow:inset 0 0 0 3px var(--hl-atk)}
.cell.reach{box-shadow:inset 0 0 0 2px var(--hl-move)}
.cell.reach::before{content:"";position:absolute;inset:0;border-radius:3px;box-shadow:inset 0 0 0 2px var(--hl-move);pointer-events:none;z-index:3}
.cell.drop{box-shadow:inset 0 0 0 3px var(--hl-move),inset 0 0 0 100px rgba(59,130,246,.28);animation:dropblink 1s ease-in-out infinite}@keyframes dropblink{50%{opacity:.6}}
.cell.target{box-shadow:inset 0 0 0 3px var(--hl-atk)}
.cell.sel{box-shadow:inset 0 0 0 3px var(--ink)}
.cap{position:absolute;left:2px;top:1px;font-size:9px;font-weight:700;color:var(--hl-atk);font-variant-numeric:tabular-nums;z-index:1}
.u{position:absolute;inset:9%;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--on-unit);font-weight:700;font-size:clamp(10px,3.2vw,15px);box-shadow:0 1px 2px rgba(0,0,0,.25);background-size:cover;background-position:center}
.u.s0{--sc:var(--p0)}.u.s1{--sc:var(--p1)}.u.s2{--sc:var(--p2)}.u.s3{--sc:var(--p3)}.u.s4{--sc:var(--p4)}
.u{background-color:var(--sc);box-shadow:0 0 0 1.5px var(--surface),0 1px 3px rgba(0,0,0,.4)}
.u.uniq{border-radius:28%}
.u.k-trainee{inset:16%}.u.k-trainee .ch{font-size:.85em}
.u.k-rookie,.u.k-mid,.u.k-vet{flex-direction:column;gap:0;line-height:1}
.u.k-rookie::before,.u.k-mid::before,.u.k-vet::before{font-size:clamp(5px,1.5vw,8px);letter-spacing:-.5px;color:#ffe27a;text-shadow:0 0 1px #0006;margin-top:-1px}
.u.k-rookie::before{content:"★"}.u.k-mid::before{content:"★★"}.u.k-vet::before{content:"★★★"}
.u.k-apc{border-radius:14%;inset:12%}
.u.k-recon:not(.hasimg),.u.k-art:not(.hasimg){background:none;box-shadow:none;isolation:isolate;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.u.k-recon:not(.hasimg)::after,.u.k-art:not(.hasimg)::after{content:"";position:absolute;z-index:-1;background:var(--sc)}
.u.k-art:not(.hasimg){inset:3%}.u.k-art:not(.hasimg)::after{inset:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.u.k-recon:not(.hasimg){inset:6%}.u.k-recon:not(.hasimg)::after{inset:14% 0;clip-path:polygon(0 18%,58% 18%,58% 0,100% 50%,58% 100%,58% 82%,0 82%)}
.u.k-recon:not(.hasimg) .ch{padding-right:12%}
.u.k-art:not(.hasimg) .ch{font-size:.8em}
.u.naval:not(.hasimg){border-radius:22%}
.u.hid{opacity:.5;outline:1.5px dashed currentColor;outline-offset:1px}
.t-sea{background-color:var(--t-sea)}
.t-shallow{background-color:var(--t-shallow)}
.u.k-missile{border-radius:22%;inset:12%}
.u.air:not(.hasimg){inset:10% 8% 16%;border-radius:50% 50% 40% 40%;box-shadow:0 0 0 1.5px var(--surface),0 0 0 2.5px rgba(255,255,255,.55),0 6px 4px -2px rgba(0,0,0,.35)}
.u.air::after{content:"";position:absolute;left:22%;right:22%;bottom:-22%;height:10%;border-radius:50%;background:rgba(0,0,0,.25)}
.u.k-theli{border-radius:30%}
.u.boosted.k-recon:not(.hasimg),.u.boosted.k-art:not(.hasimg){filter:drop-shadow(0 0 3px var(--vi))}
.u.hasimg{inset:0;border-radius:0;box-shadow:none;background-color:transparent;border:none;background-size:108% 108%;background-position:center;background-repeat:no-repeat}
.u.hasimg .a{display:none}
.u.hasimg .ch{display:none}
.u.done{opacity:.45}
.u.capping{animation:capblink .9s steps(2,jump-none) infinite}@keyframes capblink{0%{opacity:1}100%{opacity:.25}}
.u .a{position:absolute;left:-3px;top:-3px;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--surface)}
.attr.none{background:var(--muted)}
.a.Vo,.attr.Vo{background:var(--vo)}.a.Da,.attr.Da{background:var(--da)}.a.Vi,.attr.Vi{background:var(--vi)}
.u .hp{position:absolute;right:-4px;bottom:-4px;min-width:14px;height:14px;padding:0 2px;border-radius:7px;background:var(--surface);color:var(--ink);font-size:10px;line-height:14px;text-align:center;font-variant-numeric:tabular-nums;border:1px solid var(--line)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:100px}
.panel h3{margin:0;font-size:15px}
.muted{color:var(--muted);font-size:13px}
.warn{color:var(--hl-atk);font-size:13px;font-weight:700}
.attr{display:inline-block;color:var(--on-unit);font-size:11px;font-weight:700;padding:0 6px;border-radius:4px;letter-spacing:.04em}
.stat{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px;margin:0}
.stat dt{color:var(--muted)}.stat dd{margin:0;font-variant-numeric:tabular-nums}
.shop{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .nm{font-weight:700}
.item .sub{grid-column:1/-1;font-size:12px;color:var(--muted)}
.ab{border:0;border-radius:6px;padding:6px 10px;color:var(--on-unit);font-weight:700}
.ab.Vo{background:var(--vo)}.ab.Da{background:var(--da)}.ab.Vi{background:var(--vi)}
.ab:disabled{opacity:.35;cursor:not-allowed}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.vs .n{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
.vs .dmg{color:var(--hl-atk);font-size:13px;font-variant-numeric:tabular-nums}
.log{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 88%,transparent);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px));z-index:20}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
.card .big{font-family:var(--display);font-size:26px}
.setup{display:flex;flex-direction:column;gap:14px}
.startbar{position:sticky;bottom:0;z-index:5;display:flex;flex-direction:column;gap:6px;padding:10px 0 max(8px,env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 30%)}
.startbar .btn{width:100%}
.setup>.btn{align-self:start}
@media (orientation:landscape) and (min-width:700px){
#app:has(.setup){max-width:1000px}
.setup{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.setup>*{min-width:0}
.setup>div:first-child,.setup>.muted,.setup>.span2,.setup>.picks,.setup>.mappick,.setup>.startbar,.setup>.btn{grid-column:1/-1}
}
.moreBody{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 6px;text-align:left;font-size:12px;min-width:0}
.opt b{display:block;font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt[aria-pressed="true"].s0{border-color:var(--p0);box-shadow:inset 0 0 0 1px var(--p0)}
.opt[aria-pressed="true"].s1{border-color:var(--p1);box-shadow:inset 0 0 0 1px var(--p1)}
.opt[aria-pressed="true"].s2{border-color:var(--p2);box-shadow:inset 0 0 0 1px var(--p2)}
.opt[aria-pressed="true"].s3{border-color:var(--p3);box-shadow:inset 0 0 0 1px var(--p3)}.opt[aria-pressed="true"].s4{border-color:var(--p4);box-shadow:inset 0 0 0 1px var(--p4)}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
summary{font-weight:700;cursor:pointer}
details ul{margin:8px 0 0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.pal{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;min-width:0}
.pal[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pal .cell{width:30px;flex:none}
.sizer{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.imgrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.imgrow:first-child{border-top:0}
.imgrow .cell{width:44px}
.imgrow .nm{font-weight:700;min-width:0}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(340px,86vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 28px rgba(0,0,0,.2);z-index:15;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tiny{font-size:11px;color:var(--muted)}
.gens{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.gen{display:flex;flex-direction:column;align-items:flex-start;gap:0;min-width:0;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer;line-height:1.25}
.gen b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gen span{font-size:10.5px;color:var(--muted);white-space:nowrap}.gen i{font-style:normal;font-weight:700;color:var(--ink)}
.gen:not(:disabled):hover,.gen:focus-visible{border-color:var(--ink)}
.gen:disabled{opacity:.4;cursor:default}
.gen .ab{padding:5px 8px;font-size:12px}
.ucards{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.uc{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px;display:grid;grid-template-columns:34px 1fr;gap:1px 6px;text-align:left;align-items:center;min-width:0}
.uc .cell{width:34px;grid-row:span 2}
.uc .nm{font-weight:700;font-size:12px;line-height:1.2;min-width:0}
.uc .meta{font-size:11px;color:var(--muted)}
.uc .sub{grid-column:1/-1;font-size:10.5px;line-height:1.35;color:var(--muted)}
.uc:disabled{opacity:.4;cursor:not-allowed}
@media (max-width:330px){.ucards{grid-template-columns:1fr}}
/* portrait: stack header → map → panel; landscape: map left, sidebar right */
.side{display:contents}
.mapcol{display:flex;flex-direction:column;gap:6px;order:1;min-width:0}
.hdr{order:0}.panel{order:2}.log{order:3}
.rotate-hint{display:none;order:-1;font-size:12px;color:var(--muted);text-align:center}
@media (orientation:portrait) and (max-width:600px){.rotate-hint{display:block}}

function airBase(t){return !!TERR[t.type].buildAir;}
function verbOf(k,confirm){const v=UNITS[k].verb||(UNITS[k].range?'CMを流す':null);return v||(confirm?'攻撃する':'攻撃');}
const UCLS=k=>UNITS[k].generic?k:'uniq';
const uniqScale=k=>UNITS[k].power/105*0.75; /* 固有アイドルの攻撃は一律75%(負けず嫌い系でもベテランをワンパンしない) */
/* 海軍どうしの火力(%)。戦艦→戦艦7割、戦艦→護衛艦8割、戦艦→浮上中の潜水艦10割、護衛艦→戦艦4割、護衛艦→潜水艦10割、潜水艦→戦艦7割、潜水艦→護衛艦5割(未指定の組み合わせは仮) */
const NAV={battleship:{battleship:70,destroyer:80,sub:100},destroyer:{battleship:40,destroyer:60,sub:100},sub:{battleship:70,destroyer:50,sub:70}};
/* 海のユニットが受けるとき:戦艦は「固有アイドル」、ほかの海のユニットは「ベテラン」と同じ減り方 */
function basePow(a,d){
  const A=UNITS[a],D=UNITS[d];
  if(A.naval){
    if(D.naval)return (NAV[a]&&NAV[a][d])||0;
    if(D.air)return a==='destroyer'?100:0;
    if(a==='battleship')return GEN.vet[UCLS(d)]||0;
    return 0;
  }
  if(D.naval){const r=GEN[UCLS(a)][d==='battleship'?'uniq':'vet'];return UCLS(a)==='uniq'?r*uniqScale(a):r;}
  const r=GEN[UCLS(a)][UCLS(d)];return UCLS(a)==='uniq'?r*uniqScale(a):r;
}
/* 潜伏中の潜水艦は、隣に敵がいるか、護衛艦の2マス以内にいるときだけ見える */
function seenBy(v,side){
  if(!v.hidden)return true;
  if(side===null||side===undefined)return true;
  if(side<0)return false;
  if(v.side===side||(isTeam()&&!enemy(v.side,side)))return true;
  return S.units.some(w=>w.side===side&&!w.in&&w!==v&&(()=>{const d=Math.abs(w.x-v.x)+Math.abs(w.y-v.y);return d===1||(w.kind==='destroyer'&&d<=2);})());
}

function std4(np){
  const N=14,g=Array(N*N).fill('.'),starts=[];
  const rot=(x,y,k)=>{for(let r=0;r<k;r++){const t=x;x=N-1-y;y=t;}return [x,y];};
  for(let k=0;k<4;k++){for(let y=0;y<7;y++)for(let x=0;x<7;x++){const [X,Y]=rot(x,y,k);g[Y*N+X]=shiftOwner(Q4[y][x],k);}starts.push(rot(1,0,k));}
  for(let i=0;i<g.length;i++){const v=CH[g[i]];if(v[1]>=np)g[i]=neutral(g[i]);}
  const rows=[];for(let y=0;y<N;y++)rows.push(g.slice(y*N,(y+1)*N).join(''));
  return {w:N,h:N,rows,starts:starts.map((st,i)=>i<np?st:null),np};
}

function visSet(side){
  const v=new Set();if(side<0)return v;
  const mine=s=>s===side||(isTeam()&&!enemy(s,side));
  S.tiles.forEach((t,i)=>{if(t.owner>=0&&mine(t.owner)&&TERR[t.type].prop)v.add(i);});
  for(const u of S.units){if(u.in||!mine(u.side))continue;const r=VISION[UCLS(u.kind)]||1;
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const d=Math.abs(dx)+Math.abs(dy);if(d>r)continue;const x=u.x+dx,y=u.y+dy;if(x<0||y<0||x>=W||y>=H)continue;
      if(T(x,y).type==='park'&&d>1)continue;v.add(y*W+x);}}
  return v;
}
function canSee(side,v){if(!S.fog)return true;if(side===null)return true;if(v.side===side||(side>=0&&isTeam()&&!enemy(v.side,side)))return true;return visSet(side).has(v.y*W+v.x);}

function nearHQ(s){const i=S.tiles.findIndex(t=>t.type==='hq'&&t.owner===s);if(i<0)return null;const hx=i%W,hy=Math.floor(i/W);

/* 合流:弱ったHP同じアイドルに移動すると、HPを合わせる(上限10,000)。あふれた分は、あふれた割合に応じて資金に戻る */
function canMerge(me,o){return !!(me&&o&&me!==o&&me.side===o.side&&me.kind===o.kind&&UNITS[me.kind].generic&&!UNITS[me.kind].carrier&&!me.in&&!o.in&&o.fans<10000&&!cargoList(me).length&&!cargoList(o).length);}

function reachOf(u,full){

  while(q.length){q.sort((a,b)=>dist[a+'']-dist[b+'']);const [x,y]=q.shift();const d=dist[x+','+y];
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;
      const t=T(nx,ny);let c=stepCost(t,u);const o=unitAt(nx,ny);const boarding=!!(o&&o!==u&&canLoad(o,u));if(boarding)c=1;if(c>=99)continue;

function typeMult(a,d){return BEATS[a]===d?1.25:BEATS[d]===a?0.8:1;}
function livePow(att,def,fans,counter){

  if(S.units.some(v=>v.kind==='prince'&&v!==att&&v.side===att.side&&Math.abs(v.x-att.x)+Math.abs(v.y-att.y)===1))m*=1.1;
  if(att.kind==='ryugaku'&&!counter)m*=1+0.05*(att.grow||0);
  if(def.kind==='onemu')m*=0.8;
  if(def.kind==='art')m*=1.2;
  if(def.hidden&&att.kind==='battleship')m*=0.5;

const stealAmt=()=>0;
function sim(a,d){
  const d1=Math.min(livePow(a,d,a.fans,false),d.fans),s1=stealAmt(a.fans,d1),left=d.fans-d1;
  let d2=0,s2=0;if(left>0&&canCounter(d,a)){const af=a.fans+s1;d2=Math.min(livePow(d,a,left,true),af);s2=stealAmt(left,d2);}

function gain(side,amt){const p=S.players[side];p.gauge=Math.min(10,p.gauge+amt/40000);}
function killCheck(u){if(u.fans<=0){se('retire');if(!UNITS[u.kind].generic){S.retired=S.retired||{};S.retired[u.kind]=true;delete S.taken[u.kind];}const cgs=cargoList(u);S.units=S.units.filter(v=>v!==u&&!cgs.includes(v));S.tiles.forEach(t=>{if(t.capUnit===u.id){t.cap=20;t.capUnit=null;}});return true;}return false;}

const TEAMNAME=new Proxy([],{get:(o,k)=>{const t=+k;if(isNaN(t))return undefined;const m=(S.players||[]).map((p,i)=>i).filter(i=>teamOf(i)===t).map(i=>'P'+(i+1)).join('・');return `チーム${'AB'[t]}(${m})`;}});

/* 索敵の待ち伏せ:経路上に隠れた相手がいたら手前で止まる。止まった位置と、ぶつかったかどうかを返す */

/* 敵アイドルの攻撃可能範囲(次のターンに動いて届くマス。陰湿アイドルは動かずに射程内のマス) */

function onNet(m,g){
  if(typeof m==='string')try{m=JSON.parse(m);}catch(e){return;}
  const host=NET.role==='host';
  if(m.t==='welcome'&&!host){NET.side=m.side;NET.connected=true;NET.status=`${SIDE[m.side]}として参加しました`;netSend({t:'pick',s:m.side,p:(S.pick||DEFPICK)[m.side]});render();}
  else if(m.t==='full'&&!host){netLeave();NET.status='満員か、すでにゲームが始まっています';render();}
  else if(m.t==='lobby'&&!host){if(S.phase==='setup'){S.resumeNet=m.resume||null;S.pick=fullPick(m.pick);S.np=m.np;S.tmode=m.tmode;fogSel=!!m.fog;if(m.cpu)cpuSel=m.cpu;if(m.rule)ruleSel=m.rule;if(m.teams)teamSel=m.teams;if(m.bgm){const mine=bgmSel[NET.side];bgmSel=m.bgm.map(x=>({...x}));bgmSel[NET.side]=mine||bgmSel[NET.side];}}NET.lobbyNP=m.np;NET.filled=m.filled;render();}
  else if(m.t==='seat'&&host&&g){const t=m.s;if(S.phase==='setup'&&t>=0&&t<setupNP()&&!cpuSel[t]&&t!==NET.side&&!NET.guests.some(x=>x!==g&&x.open&&x.side===t)){S.pick[t]=S.pick[g.side];g.side=t;try{g.conn.send({t:'seated',side:t});}catch(e){}netLobby();render();}}
  else if(m.t==='seated'&&!host){NET.side=m.side;render();}
  else if(m.t==='bgm'&&host&&g&&m.s===g.side){bgmSel[m.s]=m.v||{};netLobby();if(S.phase==='setup')render();}
  else if(m.t==='pick'&&host&&g&&m.s===g.side){if(S.phase==='setup'){S.pick[m.s]=m.p;netLobby();render();}}
  else if(m.t==='state'){
    const q=S.quitAsk,sk=S.skillAsk;S=JSON.parse(m.s);S.quitAsk=q;S.skillAsk=sk;if(S.ui&&Array.isArray(S.ui.reach))S.ui.reach=new Set(S.ui.reach);
    W=S.w||W;H=S.h||H;NET.lastSent=m.s;NET.applying=true;render();NET.applying=false;
    if(host&&g)netSend(m,g.conn);
    if(host)netAi();
  }
  else if(m.t==='tosetup'){scr='multi';S={phase:'setup',pick:S.players?fullPick(S.players.map(p=>p.prod)):S.pick,np:S.np,tmode:S.tmode||(S.mode==='team'?'team':'ffa'),mapChoice:S.mapChoice||'m:2p-1'};if(host){if(g)netSend(m,g.conn);netLobby();}render();}
  else if(m.t==='bye'){if(!host||S.phase!=='setup'){NET.lost=true;NET.status=m.who!==undefined?`${SIDE[m.who]}との接続が切れました`:'ホストが対戦をやめました';render();}}
}
const CODECH='0123456789';
function netHost(){
  netLeave();NET.role='host';NET.code=Array.from({length:6},()=>CODECH[Math.floor(Math.random()*CODECH.length)]).join('');NET.status='準備中…';
  if(location.hash==='#localtest'){NET.peer={destroy(){}};NET.bc=localHost(NET.code,hostAccept);NET.status='参加を待っています';return;}
  loadPeer(()=>{try{
    const peer=new Peer('produce-wars-'+NET.code);NET.peer=peer;
    peer.on('open',()=>{NET.status='参加を待っています。部屋コードをみんなに伝えてください';render();});
    peer.on('connection',hostAccept);
    peer.on('error',e=>{NET.status=e.type==='unavailable-id'?'コードが重なりました。もう一度「部屋を作る」を押してください':'通信エラーが起きました('+e.type+')';render();});
  }catch(e){NET.status='通信を始められませんでした';render();}});
}
function netJoin(code){
  code=String(code).replace(/[^0-9０-９]/g,'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));if(code.length!==6){NET.status='6けたの部屋コードを入れてください';return;}
  netLeave();NET.role='guest';NET.code=code;NET.status='接続中…';
  if(location.hash==='#localtest'){guestBind(localGuest(code));return;}
  loadPeer(()=>{try{
    const peer=new Peer();NET.peer=peer;
    peer.on('open',()=>{guestBind(peer.connect('produce-wars-'+code,{reliable:true}));});
    peer.on('error',e=>{if(e.type==='peer-unavailable'){netLeave();NET.status='その部屋コードは見つかりませんでした';}else NET.status='通信エラーが起きました('+e.type+')';render();});
  }catch(e){NET.status='通信を始められませんでした';render();}});
}
function netLeave(){
  if(NET.connected)netSend({t:'bye',who:NET.role==='host'?undefined:NET.side});
  const old=NET.role;
  try{NET.conn&&NET.conn.close();}catch(e){}NET.guests.forEach(g=>{try{g.conn.close();}catch(e){}});
  try{NET.peer&&NET.peer.destroy();}catch(e){}try{NET.bc&&NET.bc.close();}catch(e){}
  Object.assign(NET,{role:null,conn:null,peer:null,bc:null,code:'',status:'',connected:false,lost:false,lastSent:'',side:0,guests:[],filled:[],lobbyNP:2});
}

function wantBgm(){
  if(S.phase==='setup'||S.phase==='edit'||S.phase==='images')return 'title.mp3';
  if(S.phase==='over')return 'victory.mp3';
  if(!S.players||!S.players[S.cur])return null;
  const p=S.players[S.cur],b=p.bgm||{};
  const res=(v,k)=>(v===undefined||v==='@p')?'p_'+p.prod+'_'+k+'.mp3':(v||null);
  if(p.boost||p.moveBonus){const sk=b.skill===''?null:res(b.skill,'skill');if(sk)return sk;}
  return res(b.turn,'turn');
}
function syncBgm(){
  if(!SND.unlocked)return;const f=SND.bgm>0?wantBgm():null;

const PB={};let held=null,nextT=0;
function poll(ts){
  let gp=null;try{gp=[...(navigator.getGamepads?navigator.getGamepads():[])].find(g=>g&&g.connected);}catch(e){}
  if(gp){
    if(!padSeen){padSeen=true;if(S.phase==='setup')render();}
    const pr=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
    const map={a:confirmRight?1:0,b:confirmRight?0:1,x:2,y:3,select:8,start:9};
    for(const [k,i] of Object.entries(map)){const p=pr(i);if(p&&!PB[k])input(k);PB[k]=p;}
    const ax=gp.axes[0]||0,ay=gp.axes[1]||0;
    const dir=(pr(12)||ay<-.6)?'up':(pr(13)||ay>.6)?'down':(pr(14)||ax<-.6)?'left':(pr(15)||ax>.6)?'right':null;
    if(dir!==held){held=dir;if(dir){input(dir);nextT=ts+260;}}

  }

}

  if(b.dataset.x!==undefined){if(S.phase==='play')tap(+b.dataset.x,+b.dataset.y);}
  else if(b.dataset.ex!==undefined){paint(+b.dataset.ex,+b.dataset.ey);}
  else if(b.dataset.a){const a=b.dataset.a;if(['cancel','back','tback','uback','quitno','skillno','ovclose','soundclose','home'].includes(a))se('cancel');else if(!['buy','fire','eigyo','skillgo','end','handoff'].includes(a))se('ok');act(a,b.dataset.v);}
  else return;
  render();
});
appEl.addEventListener('change',e=>{
  if(e.target.matches('select[data-bgm]')){const [i,k]=e.target.dataset.bgm.split(':');bgmSel[+i]=bgmSel[+i]||{};bgmSel[+i][k]=e.target.value;save('pw-bgmsel',bgmSel);if(NET.role==='guest')netSend({t:'bgm',s:+i,v:bgmSel[+i]});else if(NET.role==='host')netLobby();se('ok');}
});
appEl.addEventListener('click',e=>{const m=e.target.closest&&e.target.closest('summary[data-more]');if(m)S.moreOpen=!m.parentElement.open;});
appEl.addEventListener('input',e=>{if(e.target.matches('input[data-vol]')){const k=e.target.dataset.vol,v=+e.target.value/100;SND[k]=v;save(k==='bgm'?'pw-bgmvol':'pw-sevol',v);const b=e.target.parentElement.querySelector('b');if(b)b.textContent=e.target.value;syncBgm();if(k==='se')se('cursor');}});
function start(data){
  if(data&&data.S){S=data.S;if(S.ui&&S.ui.mode==='move')S.ui={mode:'idle'};}
  window.claude?.hot?.snapshot?.(()=>({S:{...S,ui:S.ui&&S.ui.reach?{mode:'idle'}:S.ui}}));
  updateImgCss();render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
